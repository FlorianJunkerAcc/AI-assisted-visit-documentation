_schema-version: 3.3.0
ID: aiAssistedVisitDocumentation
version: 1.0.0
description: "Voice-assisted visit documentation (SAP CAP + SAP Sales Cloud V1)"
parameters:
  enable-parallel-deployments: true

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production

modules:
  # --- CAP server -----------------------------------------------------------
  - name: aiAssistedVisitDocumentation-srv
    type: nodejs
    path: gen/srv
    parameters:
      instances: 1
      memory: 512M
      disk-quota: 1024M
      buildpack: nodejs_buildpack
    properties:
      NODE_ENV: production # selects XSUAA auth and disables the developer login
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: aiAssistedVisitDocumentation-xsuaa
      - name: aiAssistedVisitDocumentation-dest
      - name: aiAssistedVisitDocumentation-aicore

  # --- App Router (serves index.html, proxies /api and /ws/voice) -----------
  - name: aiAssistedVisitDocumentation-approuter
    type: approuter.nodejs
    path: app
    parameters:
      instances: 1
      memory: 128M
      disk-quota: 256M
    requires:
      - name: aiAssistedVisitDocumentation-xsuaa
      - name: srv-api
        group: destinations
        properties:
          name: srv-api
          url: ~{srv-url}
          forwardAuthToken: true

resources:
  # --- XSUAA ----------------------------------------------------------------
  - name: aiAssistedVisitDocumentation-xsuaa
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        # No ${org}: org names may contain spaces and dots, which XSUAA rejects.
        xsappname: aiAssistedVisitDocumentation-${space}
        tenant-mode: dedicated
        # Set here (not in xs-security.json) so the landscape domain is filled in at deploy time.
        oauth2-configuration:
          token-validity: 43200
          refresh-token-validity: 2592000
          redirect-uris:
            - https://*.${default-domain}/**

  # --- Destination service --------------------------------------------------
  - name: aiAssistedVisitDocumentation-dest
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite

  # --- AI Core (existing service instance in space AI_DEV) ------------------
  - name: aiAssistedVisitDocumentation-aicore
    type: org.cloudfoundry.existing-service
    parameters:
      service-name: aicore
