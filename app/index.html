<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Besuchsdokumentation</title>
  <style>
    :root {
      --bg:          #090910;
      --surface:     rgba(255,255,255,0.03);
      --border:      rgba(255,255,255,0.08);
      --accent:      #00d4ff;
      --accent-dim:  rgba(0,212,255,0.1);
      --accent-glow: rgba(0,212,255,0.4);
      --purple:      #9d6cff;
      --purple-dim:  rgba(157,108,255,0.1);
      --success:     #00e5a0;
      --warning:     #f59e0b;
      --error:       #ff4466;
      --text:        #dde4ee;
      --text-muted:  #5a6478;
      --text-dim:    #2e3a4e;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background-image:
        radial-gradient(ellipse 60% 50% at 10% 70%, rgba(0,212,255,0.04) 0%, transparent 60%),
        radial-gradient(ellipse 50% 60% at 90% 15%, rgba(157,108,255,0.03) 0%, transparent 60%);
    }

    /* header */
    header {
      display: flex; align-items: center; gap: 0.6rem;
      padding: 0 1.5rem; height: 2.75rem;
      border-bottom: 1px solid var(--border);
      background: rgba(9,9,16,0.85);
      backdrop-filter: blur(16px);
      position: sticky; top: 0; z-index: 10; flex-shrink: 0;
    }

    .hdr-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent-glow);
    }

    header h1 {
      font-size: 0.75rem; font-weight: 600;
      letter-spacing: 0.18em; text-transform: uppercase; color: var(--text-muted);
    }

    .hdr-badge {
      margin-left: auto; font-size: 0.6rem; letter-spacing: 0.1em;
      text-transform: uppercase; color: var(--text-dim);
      border: 1px solid var(--border); padding: 0.15rem 0.5rem; border-radius: 100px;
    }

    /* layout */
    main {
      max-width: 680px; width: 100%;
      margin: 1.75rem auto; padding: 0 1rem;
      flex: 1; display: flex; flex-direction: column; gap: 0.75rem;
    }

    /* glass card */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      backdrop-filter: blur(8px);
    }

    /* form */
    .field { display: flex; flex-direction: column; gap: 0.3rem; margin-bottom: 0.9rem; }
    .field:last-of-type { margin-bottom: 1.1rem; }
    .field label {
      font-size: 0.62rem; font-weight: 600;
      color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.12em;
    }
    .field input {
      background: rgba(255,255,255,0.04); color: var(--text);
      padding: 0.55rem 0.8rem; font-size: 0.9rem;
      border: 1px solid var(--border); border-radius: 6px; outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .field input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(0,212,255,0.1), 0 0 14px rgba(0,212,255,0.07);
    }

    /* buttons */
    .btn {
      display: inline-flex; align-items: center; gap: 0.4rem;
      padding: 0.6rem 1.5rem; font-size: 0.75rem; font-weight: 600;
      letter-spacing: 0.1em; text-transform: uppercase;
      border-radius: 6px; border: 1px solid transparent;
      cursor: pointer; transition: all 0.15s; white-space: nowrap;
      background: transparent;
    }
    .btn:disabled { opacity: 0.25; cursor: default; }

    .btn-primary {
      border-color: var(--accent); color: var(--accent); background: var(--accent-dim);
    }
    .btn-primary:not(:disabled):hover {
      background: rgba(0,212,255,0.18);
      box-shadow: 0 0 18px rgba(0,212,255,0.22), 0 0 36px rgba(0,212,255,0.07);
    }

    .btn-danger {
      border-color: var(--error); color: var(--error); background: rgba(255,68,102,0.07);
    }
    .btn-danger:not(:disabled):hover {
      background: rgba(255,68,102,0.16);
      box-shadow: 0 0 18px rgba(255,68,102,0.22);
    }

    /* login section */
    #loginSection { padding: 1.4rem 1.5rem; }
    #loginErr { color: var(--error); font-size: 0.78rem; min-height: 1rem; margin-top: 0.5rem; }

    /* voice indicator */
    .vi-wrap {
      display: flex; align-items: center; gap: 1rem;
      padding: 0.9rem 1.2rem;
    }

    /* animated ring */
    .vi-ring-outer {
      position: relative; width: 40px; height: 40px; flex-shrink: 0;
    }

    .vi-ring {
      width: 40px; height: 40px; border-radius: 50%;
      border: 2px solid var(--text-dim);
      display: flex; align-items: center; justify-content: center;
      transition: border-color 0.4s, box-shadow 0.4s;
    }

    .vi-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--text-dim);
      transition: background 0.4s, box-shadow 0.4s;
    }

    .vi-ripple {
      position: absolute; inset: -5px; border-radius: 50%;
      border: 1px solid var(--text-dim); opacity: 0;
      transition: border-color 0.4s;
    }

    /* connecting: spinner */
    .s-connecting .vi-ring {
      border-color: var(--warning); border-top-color: transparent;
      animation: spin 1s linear infinite;
    }
    .s-connecting .vi-dot { background: var(--warning); }

    /* ready: gentle pulse */
    .s-ready .vi-ring { border-color: var(--success); }
    .s-ready .vi-dot  { background: var(--success); box-shadow: 0 0 8px var(--success); }
    .s-ready .vi-ripple { border-color: var(--success); animation: ripple 2.4s ease-out infinite; }

    /* listening: faster pulse, green */
    .s-listening .vi-ring { border-color: var(--success); }
    .s-listening .vi-dot  { background: var(--success); box-shadow: 0 0 10px var(--success); }
    .s-listening .vi-ripple { border-color: var(--success); animation: ripple 1s ease-out infinite; }

    /* speaking: cyan glow + ripple */
    .s-speaking .vi-ring {
      border-color: var(--accent);
      box-shadow: 0 0 14px rgba(0,212,255,0.3), inset 0 0 10px rgba(0,212,255,0.08);
    }
    .s-speaking .vi-dot  { background: var(--accent); box-shadow: 0 0 10px var(--accent-glow); }
    .s-speaking .vi-ripple { border-color: var(--accent); animation: ripple 0.6s ease-out infinite; }

    /* error */
    .s-error .vi-ring { border-color: var(--error); }
    .s-error .vi-dot  { background: var(--error); box-shadow: 0 0 8px var(--error); }

    @keyframes spin    { to { transform: rotate(360deg); } }
    @keyframes ripple  { 0%  { transform: scale(0.9); opacity: 0.6; } 100% { transform: scale(1.7); opacity: 0; } }

    /* equalizer bars */
    .vi-eq {
      display: flex; align-items: flex-end; gap: 2px; height: 18px;
      opacity: 0; transition: opacity 0.3s;
    }
    .vi-eq-bar {
      width: 3px; border-radius: 2px;
      background: var(--accent); height: 3px;
    }
    .s-speaking .vi-eq  { opacity: 1; }
    .s-listening .vi-eq { opacity: 0.45; }
    .s-listening .vi-eq-bar { background: var(--success); }

    .s-speaking .vi-eq-bar,
    .s-listening .vi-eq-bar { animation: eq-bar 0.6s ease-in-out infinite alternate; }
    .vi-eq-bar:nth-child(1) { animation-delay: 0.00s; animation-duration: 0.42s; }
    .vi-eq-bar:nth-child(2) { animation-delay: 0.09s; animation-duration: 0.56s; }
    .vi-eq-bar:nth-child(3) { animation-delay: 0.04s; animation-duration: 0.37s; }
    .vi-eq-bar:nth-child(4) { animation-delay: 0.13s; animation-duration: 0.61s; }
    .vi-eq-bar:nth-child(5) { animation-delay: 0.07s; animation-duration: 0.48s; }
    .s-listening .vi-eq-bar { animation-duration: 1.4s !important; }

    @keyframes eq-bar { from { height: 3px; } to { height: 15px; } }

    /* status text */
    .vi-text { display: flex; flex-direction: column; gap: 0.15rem; }
    .vi-label {
      font-size: 0.6rem; font-weight: 600; letter-spacing: 0.12em;
      text-transform: uppercase; color: var(--text-muted);
    }
    #statusText { font-size: 0.85rem; color: var(--text); }

    /* preview card */
    #previewCard {
      border: 1px solid rgba(245,158,11,0.25);
      border-left: 2px solid var(--warning);
      background: rgba(245,158,11,0.04);
      border-radius: 10px;
      padding: 1rem 1.25rem;
      display: none;
    }
    .prev-title {
      font-size: 0.6rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.12em; color: var(--warning); margin-bottom: 0.6rem;
    }
    #previewText {
      white-space: pre-wrap; font-size: 0.875rem; line-height: 1.65; color: var(--text);
    }

    /* transcript */
    .tc-wrap { padding: 1rem 1.1rem; }
    #transcript {
      display: flex; flex-direction: column; gap: 0.75rem;
      max-height: 400px; overflow-y: auto;
      scrollbar-width: thin; scrollbar-color: var(--border) transparent;
    }
    #transcript:empty::before {
      content: 'Hier erscheint das Gespräch …';
      color: var(--text-dim); font-size: 0.78rem; letter-spacing: 0.05em;
      text-align: center; padding: 1.75rem 0; display: block;
    }

    /* chat bubbles */
    .brow { display: flex; flex-direction: column; gap: 0.2rem; }
    .brow.user      { align-items: flex-end; }
    .brow.assistant { align-items: flex-start; }

    .blbl {
      font-size: 0.58rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.1em;
      color: var(--text-dim); padding: 0 0.2rem;
    }

    .bbub {
      max-width: 80%; padding: 0.6rem 0.9rem;
      border-radius: 10px; font-size: 0.875rem; line-height: 1.55;
      word-break: break-word;
    }

    .brow.user .bbub {
      background: var(--accent-dim);
      border: 1px solid rgba(0,212,255,0.22);
      border-bottom-right-radius: 2px;
      color: var(--text);
    }

    .brow.assistant .bbub {
      background: var(--purple-dim);
      border: 1px solid rgba(157,108,255,0.18);
      border-bottom-left-radius: 2px;
      color: var(--text);
    }

    /* main section */
    #mainSection { display: none; flex-direction: column; gap: 0.75rem; }
    #mainSection.visible { display: flex; }

    @media (max-width: 480px) {
      header { padding: 0 1rem; }
      main { margin: 1rem auto; padding: 0 0.75rem; }
      #loginSection { padding: 1rem; }
      .bbub { max-width: 90%; }
    }
  </style>
</head>
<body>

  <header>
    <div class="hdr-dot"></div>
    <h1>Besuchsdokumentation</h1>
    <span class="hdr-badge">AI Core</span>
  </header>

  <main>

    <!-- Login -->
    <section id="loginSection" class="card">
      <!-- Hidden in production (App Router + XSUAA). Shown automatically on 401. -->
      <div id="credFields" hidden>
        <div class="field">
          <label for="u">Benutzername</label>
          <input id="u" value="alice" autocomplete="username">
        </div>
        <div class="field">
          <label for="p">Passwort</label>
          <input id="p" type="password" value="alice" autocomplete="current-password">
        </div>
      </div>
      <button class="btn btn-primary" id="startBtn" onclick="startSession()">Gespräch starten</button>
      <div id="loginErr"></div>
    </section>

    <!-- Active session -->
    <section id="mainSection">

      <!-- Voice indicator -->
      <div class="card">
        <div class="vi-wrap s-connecting" id="voiceInd">
          <div class="vi-ring-outer">
            <div class="vi-ring"><div class="vi-dot"></div></div>
            <div class="vi-ripple"></div>
          </div>
          <div class="vi-eq">
            <div class="vi-eq-bar"></div>
            <div class="vi-eq-bar"></div>
            <div class="vi-eq-bar"></div>
            <div class="vi-eq-bar"></div>
            <div class="vi-eq-bar"></div>
          </div>
          <div class="vi-text">
            <span class="vi-label">Status</span>
            <span id="statusText">Verbinde …</span>
          </div>
        </div>
      </div>

      <!-- Commit preview -->
      <div id="previewCard">
        <div class="prev-title">Vorschau</div>
        <div id="previewText"></div>
      </div>

      <!-- Transcript -->
      <div class="card tc-wrap">
        <div id="transcript"></div>
      </div>

      <!-- Stop -->
      <div>
        <button class="btn btn-danger" id="stopBtn" onclick="stopSession()">Gespräch beenden</button>
      </div>

    </section>

  </main>

  <script>
    let ws = null, audioCtx = null, micStream = null, scriptProc = null
    let nextPlayAt = 0, stopping = false, speakingTimer = null

    // --- status state ---

    function setStatusState (state, text) {
      const ind = document.getElementById('voiceInd')
      ind.className = 'vi-wrap s-' + state
      const defaults = {
        connecting: 'Verbinde …',
        ready:      'Bereit — bitte sprechen',
        listening:  'Verarbeite …',
        speaking:   'Assistent spricht',
        error:      'Fehler'
      }
      document.getElementById('statusText').textContent = text ?? defaults[state] ?? state
    }

    function loginErr (msg) { document.getElementById('loginErr').textContent = msg }

    // --- transcript ---

    function addTranscript (role, text) {
      const row = document.createElement('div')
      row.className = 'brow ' + role
      const lbl = document.createElement('span')
      lbl.className = 'blbl'
      lbl.textContent = role === 'user' ? 'Sie' : 'Assistent'
      const bub = document.createElement('div')
      bub.className = 'bbub'
      bub.textContent = String(text)
      row.appendChild(lbl)
      row.appendChild(bub)
      const tc = document.getElementById('transcript')
      tc.appendChild(row)
      row.scrollIntoView({ behavior: 'smooth', block: 'nearest' })
    }

    // --- audio playback: PCM16 → AudioContext ---

    function playPcm16 (buf) {
      if (!audioCtx) return
      const i16 = new Int16Array(buf)
      const ab = audioCtx.createBuffer(1, i16.length, 24000)
      const f32 = ab.getChannelData(0)
      for (let i = 0; i < i16.length; i++) f32[i] = i16[i] / 32768
      const src = audioCtx.createBufferSource()
      src.buffer = ab; src.connect(audioCtx.destination)
      const now = audioCtx.currentTime
      const t = Math.max(now + 0.04, nextPlayAt)
      src.start(t); nextPlayAt = t + ab.duration

      setStatusState('speaking')
      clearTimeout(speakingTimer)
      speakingTimer = setTimeout(() => {
        if (ws && ws.readyState === WebSocket.OPEN) setStatusState('ready')
      }, 700)
    }

    // --- microphone: Float32 → PCM16 via ScriptProcessor ---

    async function startMicrophone () {
      micStream = await navigator.mediaDevices.getUserMedia({
        audio: { channelCount: 1, sampleRate: 24000, echoCancellation: true, noiseSuppression: true, autoGainControl: false },
        video: false
      })
      audioCtx = new AudioContext({ sampleRate: 24000 })
      nextPlayAt = 0
      const src = audioCtx.createMediaStreamSource(micStream)
      scriptProc = audioCtx.createScriptProcessor(4096, 1, 1)
      scriptProc.onaudioprocess = (e) => {
        if (!ws || ws.readyState !== WebSocket.OPEN) return
        const f32 = e.inputBuffer.getChannelData(0)
        const i16 = new Int16Array(f32.length)
        for (let i = 0; i < f32.length; i++)
          i16[i] = Math.max(-32768, Math.min(32767, Math.round(f32[i] * 32767)))
        ws.send(i16.buffer)
      }
      src.connect(scriptProc)
      scriptProc.connect(audioCtx.destination)
    }

    function stopAudio () {
      clearTimeout(speakingTimer)
      if (scriptProc) { try { scriptProc.disconnect() } catch {} scriptProc = null }
      if (micStream)  { micStream.getTracks().forEach(t => t.stop()); micStream = null }
      if (audioCtx)   { try { audioCtx.close() } catch {} audioCtx = null }
    }

    // --- session lifecycle ---

    async function startSession () {
      loginErr('')
      document.getElementById('startBtn').disabled = true
      const credFields = document.getElementById('credFields')

      // Build auth headers.
      // Production: App Router adds XSUAA JWT, no credentials needed here.
      // Development: mocked auth uses Basic Auth; credentials shown after first 401.
      // BAS tunnel: strips Authorization headers → retry with ?_dev_user= fallback.
      const headers = {}
      let devUserParam = ''
      if (!credFields.hidden) {
        const user = document.getElementById('u').value.trim()
        if (!user) {
          loginErr('Bitte Benutzernamen eingeben.')
          document.getElementById('startBtn').disabled = false
          return
        }
        headers['Authorization'] = 'Basic ' + btoa(user + ':' + document.getElementById('p').value)
        devUserParam = user
      }

      // 1. Fetch one-time WebSocket token from CAP
      let token
      try {
        let res = await fetch('/api/voice-token', { headers })
        if (res.status === 401 && credFields.hidden) {
          credFields.hidden = false
          loginErr('Bitte Zugangsdaten eingeben (Entwicklungsmodus).')
          document.getElementById('startBtn').disabled = false
          return
        }
        if (res.status === 401 && devUserParam)
          res = await fetch('/api/voice-token?_dev_user=' + encodeURIComponent(devUserParam))
        if (!res.ok) {
          loginErr('Anmeldung fehlgeschlagen (' + res.status + '). Zugangsdaten prüfen.')
          document.getElementById('startBtn').disabled = false
          return
        }
        token = (await res.json()).token
      } catch (err) {
        loginErr('Verbindungsfehler: ' + err.message)
        document.getElementById('startBtn').disabled = false
        return
      }

      // 2. Switch view
      document.getElementById('loginSection').hidden = true
      const mainSec = document.getElementById('mainSection')
      mainSec.classList.add('visible')
      document.getElementById('transcript').innerHTML = ''
      document.getElementById('previewCard').style.display = 'none'
      document.getElementById('previewText').textContent = ''
      document.getElementById('stopBtn').disabled = false
      stopping = false
      setStatusState('connecting')

      // 3. Microphone access (must be on user-gesture stack)
      try {
        await startMicrophone()
      } catch (err) {
        stopAudio()
        document.getElementById('loginSection').hidden = false
        mainSec.classList.remove('visible')
        loginErr('Mikrofonzugriff verweigert: ' + err.message)
        document.getElementById('startBtn').disabled = false
        return
      }

      // 4. Open WebSocket with one-time token
      const proto = location.protocol === 'https:' ? 'wss:' : 'ws:'
      ws = new WebSocket(proto + '//' + location.host + '/ws/voice?token=' + encodeURIComponent(token))
      ws.binaryType = 'arraybuffer'

      ws.onopen = () => {
        setStatusState('connecting', 'Sitzung wird gestartet …')
        ws.send(JSON.stringify({
          type: 'start',
          timeZone: Intl.DateTimeFormat().resolvedOptions().timeZone,
          language: 'de'
        }))
      }

      ws.onmessage = (e) => {
        if (e.data instanceof ArrayBuffer) { playPcm16(e.data); return }
        let msg
        try { msg = JSON.parse(e.data) } catch { return }

        if (msg.type === 'ready') {
          setStatusState('ready')
        } else if (msg.type === 'transcript') {
          addTranscript(msg.role, msg.text)
          if (msg.role === 'user') setStatusState('listening', 'Verarbeite …')
        } else if (msg.type === 'commit_preview') {
          document.getElementById('previewText').textContent = msg.previewText ?? ''
          document.getElementById('previewCard').style.display = 'block'
          setStatusState('ready', 'Vorschau — bitte bestätigen oder ablehnen')
        } else if (msg.type === 'done') {
          const ok = msg.status === 'COMPLETED'
          setStatusState(ok ? 'ready' : 'error',
            ok ? 'Besuch erfolgreich gespeichert' : 'Teilweise gespeichert (' + msg.code + ')')
        } else if (msg.type === 'error') {
          setStatusState('error', String(msg.message ?? msg.code ?? 'Unbekannter Fehler'))
        } else if (msg.type === 'stopped') {
          if (ws) ws.close()
        }
      }

      ws.onerror = () => setStatusState('error', 'WebSocket-Verbindungsfehler')

      ws.onclose = () => {
        stopAudio(); ws = null
        const delay = stopping ? 0 : 1800
        setTimeout(() => {
          document.getElementById('loginSection').hidden = false
          document.getElementById('mainSection').classList.remove('visible')
          document.getElementById('startBtn').disabled = false
        }, delay)
      }
    }

    function stopSession () {
      stopping = true
      document.getElementById('stopBtn').disabled = true
      setStatusState('connecting', 'Sitzung wird beendet …')
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'stop' }))
      } else {
        stopAudio(); ws = null
        document.getElementById('loginSection').hidden = false
        document.getElementById('mainSection').classList.remove('visible')
        document.getElementById('startBtn').disabled = false
      }
    }
  </script>
</body>
</html>
