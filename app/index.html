<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Besuchsdokumentation</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; color: #1a1a1a; }
    h1 { font-size: 1.4rem; margin-bottom: 1.5rem; }
    button { padding: 0.5rem 1.2rem; font-size: 1rem; border-radius: 4px; border: 1px solid #aaa; cursor: pointer; background: #f0f0f0; }
    button.primary { background: #0063c5; color: #fff; border-color: #0063c5; }
    button.danger  { background: #c50000; color: #fff; border-color: #c50000; }
    button:disabled { opacity: 0.5; cursor: default; }
    input { padding: 0.4rem 0.6rem; font-size: 1rem; border: 1px solid #aaa; border-radius: 4px; width: 100%; }
    .row { display: flex; flex-direction: column; gap: 0.4rem; margin-bottom: 0.8rem; }
    label { font-size: 0.85rem; font-weight: 600; }
    #status { margin: 1rem 0 0.5rem; color: #555; font-style: italic; min-height: 1.4rem; }
    #transcript { margin-top: 1rem; border-top: 1px solid #ddd; padding-top: 1rem; }
    .msg { margin: 0.4rem 0; line-height: 1.4; }
    .msg .lbl { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; margin-right: 0.4rem; }
    .msg.user .lbl { color: #0063c5; }
    .msg.assistant .lbl { color: #005c35; }
    #preview { background: #fffbea; border: 1px solid #e0c000; border-radius: 4px; padding: 0.75rem; margin-top: 0.75rem; white-space: pre-wrap; font-size: 0.9rem; display: none; }
    #loginErr { color: #c50000; margin-top: 0.6rem; min-height: 1.2rem; font-size: 0.9rem; }
  </style>
</head>
<body>
  <h1>Besuchsdokumentation</h1>

  <section id="loginSection">
    <div class="row">
      <label for="u">Benutzername</label>
      <input id="u" value="alice" autocomplete="username">
    </div>
    <div class="row">
      <label for="p">Passwort</label>
      <input id="p" type="password" value="alice" autocomplete="current-password">
    </div>
    <button class="primary" id="startBtn" onclick="startSession()">Gespräch starten</button>
    <div id="loginErr"></div>
  </section>

  <section id="mainSection" hidden>
    <button class="danger" id="stopBtn" onclick="stopSession()">Gespräch beenden</button>
    <div id="status">Verbinde …</div>
    <div id="preview"></div>
    <div id="transcript"></div>
  </section>

  <script>
    let ws = null
    let audioCtx = null
    let micStream = null
    let scriptProc = null
    let nextPlayAt = 0
    let stopping = false

    // --- UI helpers ---

    function loginErr(msg) {
      document.getElementById('loginErr').textContent = msg
    }

    function setStatus(text) {
      document.getElementById('status').textContent = text
    }

    function addTranscript(role, text) {
      const div = document.createElement('div')
      div.className = 'msg ' + role
      const lbl = role === 'user' ? 'Sie' : 'Assistent'
      div.innerHTML = '<span class="lbl">' + lbl + '</span>' + esc(text)
      document.getElementById('transcript').appendChild(div)
      div.scrollIntoView({ behavior: 'smooth', block: 'nearest' })
    }

    function esc(s) {
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    }

    // --- Audio playback: PCM16 → AudioContext ---

    function playPcm16(buf) {
      if (!audioCtx) return
      const i16 = new Int16Array(buf)
      const ab = audioCtx.createBuffer(1, i16.length, 24000)
      const f32 = ab.getChannelData(0)
      for (let i = 0; i < i16.length; i++) f32[i] = i16[i] / 32768
      const src = audioCtx.createBufferSource()
      src.buffer = ab
      src.connect(audioCtx.destination)
      const now = audioCtx.currentTime
      const t = Math.max(now + 0.04, nextPlayAt)
      src.start(t)
      nextPlayAt = t + ab.duration
    }

    // --- Microphone capture: MediaStream → PCM16 via ScriptProcessor ---

    async function startMicrophone() {
      micStream = await navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1, sampleRate: 24000 }, video: false })
      audioCtx = new AudioContext({ sampleRate: 24000 })
      nextPlayAt = 0
      const src = audioCtx.createMediaStreamSource(micStream)
      scriptProc = audioCtx.createScriptProcessor(4096, 1, 1)
      scriptProc.onaudioprocess = (e) => {
        if (!ws || ws.readyState !== WebSocket.OPEN) return
        const f32 = e.inputBuffer.getChannelData(0)
        const i16 = new Int16Array(f32.length)
        for (let i = 0; i < f32.length; i++) {
          i16[i] = Math.max(-32768, Math.min(32767, Math.round(f32[i] * 32767)))
        }
        ws.send(i16.buffer)
      }
      src.connect(scriptProc)
      // Connect to destination to keep the processor alive (output is silent — mic monitor off)
      scriptProc.connect(audioCtx.destination)
    }

    function stopAudio() {
      if (scriptProc) { try { scriptProc.disconnect() } catch {} scriptProc = null }
      if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null }
      if (audioCtx) { try { audioCtx.close() } catch {} audioCtx = null }
    }

    // --- Session lifecycle ---

    async function startSession() {
      loginErr('')
      document.getElementById('startBtn').disabled = true
      const user = document.getElementById('u').value.trim()
      const pass = document.getElementById('p').value

      if (!user) {
        loginErr('Bitte Benutzernamen eingeben.')
        document.getElementById('startBtn').disabled = false
        return
      }

      // 1. Fetch one-time WebSocket token from CAP
      let token
      try {
        const res = await fetch('/api/voice-token', {
          headers: { Authorization: 'Basic ' + btoa(user + ':' + pass) }
        })
        if (!res.ok) {
          loginErr('Anmeldung fehlgeschlagen (' + res.status + '). Zugangsdaten prüfen.')
          document.getElementById('startBtn').disabled = false
          return
        }
        token = (await res.json()).token
      } catch (err) {
        loginErr('Verbindungsfehler: ' + err.message)
        document.getElementById('startBtn').disabled = false
        return
      }

      // 2. Switch view
      document.getElementById('loginSection').hidden = true
      document.getElementById('mainSection').hidden = false
      document.getElementById('transcript').innerHTML = ''
      document.getElementById('preview').style.display = 'none'
      document.getElementById('stopBtn').disabled = false
      stopping = false
      setStatus('Mikrofon wird aktiviert …')

      // 3. Request microphone access (must happen on user-gesture stack)
      try {
        await startMicrophone()
      } catch (err) {
        stopAudio()
        document.getElementById('loginSection').hidden = false
        document.getElementById('mainSection').hidden = true
        loginErr('Mikrofonzugriff verweigert: ' + err.message)
        document.getElementById('startBtn').disabled = false
        return
      }

      // 4. Open WebSocket with token
      const proto = location.protocol === 'https:' ? 'wss:' : 'ws:'
      ws = new WebSocket(proto + '//' + location.host + '/ws/voice?token=' + encodeURIComponent(token))
      ws.binaryType = 'arraybuffer'

      ws.onopen = () => {
        setStatus('Verbunden. Sitzung wird gestartet …')
        ws.send(JSON.stringify({
          type: 'start',
          timeZone: Intl.DateTimeFormat().resolvedOptions().timeZone,
          language: 'de'
        }))
      }

      ws.onmessage = (e) => {
        if (e.data instanceof ArrayBuffer) { playPcm16(e.data); return }
        let msg
        try { msg = JSON.parse(e.data) } catch { return }

        if (msg.type === 'ready') {
          setStatus('Bereit. Bitte sprechen Sie.')
        } else if (msg.type === 'transcript') {
          addTranscript(msg.role, msg.text)
        } else if (msg.type === 'commit_preview') {
          const p = document.getElementById('preview')
          p.textContent = msg.previewText ?? ''
          p.style.display = 'block'
          setStatus('Vorschau wird vorgelesen. Bitte bestätigen oder ablehnen.')
        } else if (msg.type === 'done') {
          setStatus(msg.status === 'COMPLETED' ? '✓ Besuch erfolgreich gespeichert.' : '⚠ Teilweise gespeichert (' + msg.code + ').')
        } else if (msg.type === 'error') {
          setStatus('Fehler: ' + esc(msg.message ?? msg.code))
        } else if (msg.type === 'stopped') {
          if (ws) ws.close()
        }
      }

      ws.onerror = () => setStatus('WebSocket-Verbindungsfehler.')

      ws.onclose = () => {
        stopAudio()
        ws = null
        const delay = stopping ? 0 : 1800
        setTimeout(() => {
          document.getElementById('loginSection').hidden = false
          document.getElementById('mainSection').hidden = true
          document.getElementById('startBtn').disabled = false
        }, delay)
      }
    }

    function stopSession() {
      stopping = true
      document.getElementById('stopBtn').disabled = true
      setStatus('Sitzung wird beendet …')
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'stop' }))
      } else {
        stopAudio()
        ws = null
        document.getElementById('loginSection').hidden = false
        document.getElementById('mainSection').hidden = true
        document.getElementById('startBtn').disabled = false
      }
    }
  </script>
</body>
</html>
