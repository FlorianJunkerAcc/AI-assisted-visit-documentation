<!DOCTYPE html>
<html lang="de" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Besuchsdokumentation</title>

  <!-- Theme before first paint (no flash). Real Horizon theme is applied by UI5 after load. -->
  <script>
    (function () {
      var t = null
      try { t = localStorage.getItem('visit-theme') } catch (e) {}
      if (t !== 'light' && t !== 'dark') t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
      document.documentElement.setAttribute('data-theme', t)
    })()
  </script>

  <!-- SAP Fiori / Horizon: official UI5 Web Components, bundled locally (npm run build:ui) -->
  <script type="module" src="ui5.bundle.js"></script>

  <style>
    [hidden] { display: none !important; }
    *, *::before, *::after { box-sizing: border-box; }
    html[data-theme="light"] { background: #f5f6f7; }
    html[data-theme="dark"]  { background: #12171c; }

    body {
      margin: 0; min-height: 100dvh;
      display: flex; flex-direction: column;
      font-family: var(--sapFontFamily, '72', '72full', Arial, Helvetica, sans-serif);
      font-size: var(--sapFontSize, 0.875rem);
      color: var(--sapTextColor, #1d2d3e);
      background: var(--sapBackgroundColor, #f5f6f7);
    }

    /* ---------- Page (Fiori spacing: 1rem / 2rem content padding) ---------- */
    .page {
      flex: 1; width: 100%; max-width: 90rem; margin: 0 auto;
      padding: 1rem 1rem 2rem;
    }
    @media (min-width: 600px)  { .page { padding: 1.5rem 2rem 2rem; } }
    .page-header { display: flex; flex-direction: column; gap: 0.25rem; margin-bottom: 1rem; }
    .page-header ui5-text { color: var(--sapContent_LabelColor); }

    .layout { display: grid; gap: 1rem; grid-template-columns: minmax(0, 1fr); }
    @media (min-width: 1024px) {
      .layout { grid-template-columns: minmax(0, 7fr) minmax(20rem, 4fr); align-items: start; }
    }
    .side { display: flex; flex-direction: column; gap: 1rem; min-width: 0; }

    /* ---------- Voice interaction area: surface follows the theme, halo colours stay blue/violet ---------- */
    .voice {
      position: relative; display: flex; flex-direction: column; overflow: hidden;
      min-height: clamp(26rem, 70dvh, 48rem);
      border-radius: var(--sapElement_BorderCornerRadius, 0.75rem);
      box-shadow: var(--sapContent_Shadow0, 0 0 0 0.0625rem rgba(85, 107, 129, 0.25));
    }
    /* Light: bright Fiori tile surface, text colours come from the theme */
    html[data-theme="light"] .voice {
      background:
        radial-gradient(55% 45% at 50% 42%, rgba(91, 91, 255, 0.07) 0%, transparent 70%),
        var(--sapTile_Background, #ffffff);
    }
    /* Dark: near-black surface; make the UI5 text components readable on it */
    html[data-theme="dark"] .voice {
      background:
        radial-gradient(55% 45% at 50% 42%, rgba(70, 62, 210, 0.14) 0%, transparent 70%),
        #02030a;
      --sapTextColor: #eef0ff;
      --sapGroup_TitleTextColor: #ffffff;
      --sapContent_LabelColor: rgba(200, 208, 255, 0.72);
    }
    html[data-theme="light"] body.is-error .voice { --sapGroup_TitleTextColor: var(--sapNegativeTextColor, #b00); }
    html[data-theme="dark"]  body.is-error .voice { --sapGroup_TitleTextColor: #ffc2cf; }

    #stage { position: relative; flex: 1 1 0; min-height: 18rem; }
    #halo { position: absolute; inset: 0; margin: auto; display: block; pointer-events: none; }
    #haloFallback {
      display: none; position: absolute; inset: 0; margin: auto;
      width: 58%; max-width: 26rem; aspect-ratio: 1; border-radius: 50%;
      border: 2px solid rgba(150, 150, 255, 0.9);
      box-shadow: 0 0 40px rgba(91, 91, 255, 0.55), inset 0 0 40px rgba(91, 91, 255, 0.25);
      animation: fbPulse 3.2s ease-in-out infinite;
    }
    .no-gl #halo { display: none; }
    .no-gl #haloFallback { display: block; }
    @keyframes fbPulse { 0%, 100% { transform: scale(1); opacity: .8 } 50% { transform: scale(1.04); opacity: 1 } }

    .voice-info {
      display: flex; flex-direction: column; align-items: center; gap: 0.25rem;
      padding: 0 1rem 1.5rem; text-align: center; min-height: 4.5rem;
    }
    #statusText { max-width: 32rem; }

    /* ---------- Cards / forms (all Fiori components, only layout CSS here) ---------- */
    ui5-card { width: 100%; }
    .card-body { display: flex; flex-direction: column; gap: 1rem; padding: 1rem; }
    .field { display: flex; flex-direction: column; gap: 0.25rem; }
    .field ui5-input { width: 100%; }
    .actions { display: flex; flex-wrap: wrap; gap: 0.5rem; }
    .actions ui5-button { flex: 1 1 auto; }

    #previewText { white-space: pre-wrap; line-height: 1.5; padding: 1rem; display: block; }

    #transcriptScroll { max-height: 20rem; overflow-y: auto; }
    .msg { display: flex; gap: 0.75rem; align-items: flex-start; padding: 0.25rem 0; width: 100%; }
    .msg ui5-icon { flex: none; margin-top: 0.125rem; color: var(--sapContent_IconColor); }
    .msg.assistant ui5-icon { color: var(--sapAccentColor6, #5b5bff); }
    .msg-col { display: flex; flex-direction: column; gap: 0.125rem; min-width: 0; }
    .msg-role { color: var(--sapContent_LabelColor); font-size: var(--sapFontSmallSize, 0.75rem); }
    .msg-text { white-space: normal; overflow-wrap: anywhere; }

    @media (prefers-reduced-motion: reduce) { #haloFallback { animation: none; } }
  </style>
</head>
<body>

  <ui5-shellbar id="shell" primary-title="Besuchsdokumentation" secondary-title="Sprachassistent">
    <img slot="logo" src="sap-logo.svg" alt="SAP">
    <ui5-shellbar-item id="themeBtn" icon="dark-mode" text="Dunkles Design"></ui5-shellbar-item>
  </ui5-shellbar>

  <main class="page">
    <div class="page-header">
      <ui5-title level="H1" size="H2">Besuch dokumentieren</ui5-title>
      <ui5-text>Dokumentiere deinen heutigen Kundenbesuch per Sprache. Gespeichert wird erst nach deiner Bestätigung.</ui5-text>
    </div>

    <div class="layout">

      <!-- AI voice halo: always dark, large, centered -->
      <section class="voice" aria-label="Sprachassistent">
        <div id="stage">
          <canvas id="halo" aria-label="KI-Statusanzeige" role="img"></canvas>
          <div id="haloFallback" aria-hidden="true"></div>
        </div>
        <div class="voice-info" aria-live="polite">
          <ui5-title id="stateLabel" level="H3">Bereit</ui5-title>
          <ui5-text id="statusText">Bereit, wenn du es bist</ui5-text>
        </div>
      </section>

      <div class="side">

        <!-- Session (login, start / stop) -->
        <ui5-card id="sessionCard">
          <ui5-card-header slot="header" title-text="Sitzung" subtitle-text="Verbindung und Steuerung">
            <ui5-icon slot="avatar" name="microphone"></ui5-icon>
          </ui5-card-header>
          <div class="card-body">
            <ui5-message-strip id="msgStrip" design="Negative" hide-close-button hidden></ui5-message-strip>

            <div id="loginSection" class="card-body" style="padding:0">
              <div id="credFields" class="card-body" style="padding:0" hidden>
                <div class="field">
                  <ui5-label for="u" show-colon>Benutzername</ui5-label>
                  <ui5-input id="u" value="alice" autocomplete="username"></ui5-input>
                </div>
                <div class="field">
                  <ui5-label for="p" show-colon>Passwort</ui5-label>
                  <ui5-input id="p" type="Password" value="alice" autocomplete="current-password"></ui5-input>
                </div>
              </div>
              <div class="actions">
                <ui5-button id="startBtn" design="Emphasized" icon="microphone">Gespräch starten</ui5-button>
              </div>
            </div>

            <div id="mainSection" class="actions" hidden>
              <ui5-button id="pauseBtn" icon="media-pause" disabled>Pausieren</ui5-button>
              <ui5-button id="stopBtn" design="Negative" icon="stop">Gespräch beenden</ui5-button>
            </div>
          </div>
        </ui5-card>

        <!-- Commit preview -->
        <ui5-card id="previewCard" hidden>
          <ui5-card-header slot="header" title-text="Vorschau" subtitle-text="Bitte per Sprache bestätigen oder ablehnen">
            <ui5-icon slot="avatar" name="document-text"></ui5-icon>
          </ui5-card-header>
          <ui5-text id="previewText"></ui5-text>
        </ui5-card>

        <!-- Transcript -->
        <ui5-panel id="tcPanel" header-text="Transkript" collapsed>
          <div id="transcriptScroll">
            <ui5-list id="transcript" no-data-text="Hier erscheint das Gespräch …"></ui5-list>
          </div>
        </ui5-panel>

      </div>
    </div>
  </main>

  <noscript>Diese Anwendung benötigt JavaScript.</noscript>

  <script>
    /* =====================================================================
       AI VOICE HALO — WebGL fragment shader (analytic, no noise textures)

       Look: thin glowing core ring + 9 translucent wave ribbons around it.
       Per-state weights (listen / think / speak) are eased in JS and blended
       in the shader, so every transition is continuous.
       Wave phases are accumulated in JS (speed can change without jumps) and
       wrapped at 2π; the shader only uses integer multiples of them.
    ===================================================================== */

    const VERT_SRC = `
      attribute vec2 a_pos;
      void main() { gl_Position = vec4(a_pos, 0.0, 1.0); }
    `

    const FRAG_SRC = `
      #ifdef GL_FRAGMENT_PRECISION_HIGH
      precision highp float;
      #else
      precision mediump float;
      #endif

      uniform vec2  u_res;
      uniform vec4  u_ph;   /* wave phases (wrapped 0..2π)                    */
      uniform vec4  u_w;    /* x=listen y=think z=speak w=active              */
      uniform vec2  u_amp;  /* x=audio level 0..1, y=error tint 0..1          */
      uniform float u_t;    /* seconds (wrapped), sparkle twinkle only        */
      uniform float u_light; /* 0 = dark surface (glow), 1 = light surface (ink) */

      #define TAU 6.28318530718

      float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }

      /* cyclic palette: indigo / azure / violet / ice */
      vec3 pal(float t) {
        float a  = TAU * t;
        float s1 = 0.5 + 0.5 * sin(a);
        float s2 = 0.5 + 0.5 * sin(2.0 * a + 1.0);
        float s3 = 0.5 + 0.5 * sin(a + 2.5);
        vec3 c0 = vec3(0.28, 0.22, 1.00);
        vec3 c1 = vec3(0.16, 0.55, 1.00);
        vec3 c2 = vec3(0.66, 0.30, 1.00);
        vec3 c3 = vec3(0.50, 0.82, 1.00);
        return mix(mix(c0, c1, s1), mix(c2, c3, s2), s3);
      }

      void main() {
        vec2  p   = (gl_FragCoord.xy - 0.5 * u_res) / (0.5 * min(u_res.x, u_res.y));
        float rad = length(p);
        float ang = atan(p.y, p.x);

        float lvl = u_amp.x;
        float wL = u_w.x, wT = u_w.y, wS = u_w.z, act = u_w.w;

        /* breathing + level swell */
        float R  = 0.62 * (1.0 + 0.008 * sin(u_ph.w) + 0.018 * lvl * (wL + wS));
        float e0 = rad - R;
        float a0 = abs(e0);

        /* core ring + bloom */
        float core = exp(-a0 * a0 * 22000.0);
        float glow = exp(-a0 * 16.0) * 0.30 + exp(-a0 * 5.0) * 0.10;
        float cph  = fract(ang / TAU + u_ph.z / TAU);
        vec3  col  = pal(cph);
        float bri  = 0.55 + 0.45 * act;
        /* ring highlight: icy white on dark, saturated indigo on light (white would vanish) */
        vec3  hi   = mix(vec3(0.85, 0.95, 1.0), vec3(0.30, 0.26, 0.95), u_light);
        vec3  c    = (mix(col, hi, 0.55) * core + col * glow) * bri;

        /* ribbons */
        float pres = clamp(wL * 0.85 + wT + wS, 0.0, 1.0);
        if (pres > 0.003 && a0 < 0.34) {
          vec3 acc = vec3(0.0);
          float aL = 0.05 + 0.09 * lvl;
          float aT = 0.085;
          float aS = 0.05 + 0.10 * lvl;
          for (int k = 0; k < 9; k++) {
            float f  = float(k);
            float fk = f / 8.0;
            float sc = 0.30 + 0.70 * fk;

            /* listening: soft flowing lobes */
            float wl = 0.60 * sin(3.0 * ang + u_ph.x + f * 0.80)
                     + 0.40 * sin(5.0 * ang - u_ph.y + f * 1.30);
            /* thinking: offset, slowly rotating overlapping rings */
            float wt = 0.65 * cos(ang - u_ph.z - f * 0.45)
                     + 0.35 * cos(2.0 * ang + u_ph.y + f * 0.60);
            /* speaking: dense, energetic lobes */
            float ws = 0.55 * sin(9.0 * ang + 2.0 * u_ph.x + f * 1.10)
                     + 0.45 * sin(13.0 * ang - 2.0 * u_ph.y + f * 1.70);

            float d    = (wL * aL * wl + wT * aT * wt + wS * aS * ws) * sc;
            float e    = rad - (R + d);
            float line = exp(-e * e * 7000.0);
            float haze = exp(-abs(e) * 28.0) * 0.06;
            vec3  lc   = pal(fract(ang / TAU + u_ph.z / TAU * 0.5 + fk * 0.35));
            acc += lc * (line * 0.38 + haze);
          }
          c += acc * pres;
        }

        /* speaking: sparkle dust drifting outside the ring */
        if (wS > 0.01 && rad > R * 0.95 && rad < 1.0) {
          vec2  g    = vec2(ang / TAU * 160.0, rad * 70.0);
          vec2  id   = floor(g);
          vec2  lcl  = fract(g) - 0.5;
          float h    = hash(id);
          float tw   = 0.5 + 0.5 * sin(u_t * (2.0 + h * 3.0) + h * 30.0);
          float dotv = smoothstep(0.28, 0.0, length(lcl)) * step(0.90, h) * tw;
          float zone = exp(-max(rad - R - 0.02, 0.0) * 9.0) * smoothstep(R * 0.95, R + 0.03, rad);
          c += pal(fract(h * 3.0)) * dotv * zone * wS * (0.4 + 0.9 * lvl) * 1.2;
        }

        /* fade everything out before the canvas edge (otherwise the glow tail shows as a box on light surfaces) */
        c *= smoothstep(1.0, 0.78, rad);

        /* soft highlight roll-off */
        c = 1.0 - exp(-c * 1.5);

        /* error tint */
        float lum = dot(c, vec3(0.30, 0.50, 0.20));
        c = mix(c, vec3(1.0, 0.25, 0.40) * lum * 1.4, u_amp.y);

        /* dither against banding in the glow */
        float m = max(c.r, max(c.g, c.b));
        c += (hash(gl_FragCoord.xy) - 0.5) / 255.0 * smoothstep(0.0, 0.02, m);

        /* dark surface: premultiplied colour with alpha = max channel behaves like additive light.
           light surface: same intensity used as alpha, colour darkened -> coloured "ink" on white. */
        vec3  ink = (c / max(m, 0.001)) * 0.72;
        float aL  = min(m * 1.35, 1.0);
        gl_FragColor = mix(vec4(c, m), vec4(ink * aL, aL), u_light);
      }
    `

    const Halo = (() => {
      const TAU    = Math.PI * 2
      const canvas = document.getElementById('halo')
      const stage  = document.getElementById('stage')
      const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches
      const coarse = window.matchMedia('(pointer: coarse)').matches
      const maxDpr = coarse ? 1.5 : 2
      const motion = reduce ? 0.35 : 1

      const MODES = {
        idle:       { L: 0, T: 0,    S: 0, act: 0,   err: 0 },
        connecting: { L: 0, T: 0.75, S: 0, act: 0.6, err: 0 },
        listening:  { L: 1, T: 0,    S: 0, act: 1,   err: 0 },
        thinking:   { L: 0, T: 1,    S: 0, act: 1,   err: 0 },
        speaking:   { L: 0, T: 0,    S: 1, act: 1,   err: 0 },
        error:      { L: 0, T: 0,    S: 0, act: 0.5, err: 1 }
      }
      const KEYS = ['L', 'T', 'S', 'act', 'err']
      const cur  = { L: 0, T: 0, S: 0, act: 0, err: 0 }
      let tgt = MODES.idle, mode = 'idle'
      const sources = {}                 /* mode -> { node, buf, gain } */
      let lvl = 0
      const ph = [0, 0, 0, 0]
      /* surface brightness: 0 = dark (glow), 1 = light (ink); starts at the theme set before first paint */
      let lightTgt = document.documentElement.getAttribute('data-theme') === 'light' ? 1 : 0
      let lightCur = lightTgt

      let gl = null, prog = null, U = {}, raf = 0, last = 0
      let cssSize = 0, quality = 1, appliedQ = 0
      let emaDt = 16, frames = 0

      function build () {
        gl = canvas.getContext('webgl', { alpha: true, premultipliedAlpha: true, antialias: false, depth: false, stencil: false })
        if (!gl) return false

        const mk = (type, src) => {
          const s = gl.createShader(type)
          gl.shaderSource(s, src); gl.compileShader(s)
          if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
            console.error('Halo shader:', gl.getShaderInfoLog(s)); return null
          }
          return s
        }
        const vs = mk(gl.VERTEX_SHADER, VERT_SRC), fs = mk(gl.FRAGMENT_SHADER, FRAG_SRC)
        if (!vs || !fs) return false
        prog = gl.createProgram()
        gl.attachShader(prog, vs); gl.attachShader(prog, fs)
        gl.linkProgram(prog)
        if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) { console.error(gl.getProgramInfoLog(prog)); return false }
        gl.useProgram(prog)

        const buf = gl.createBuffer()
        gl.bindBuffer(gl.ARRAY_BUFFER, buf)
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW)
        const loc = gl.getAttribLocation(prog, 'a_pos')
        gl.enableVertexAttribArray(loc)
        gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0)

        U = {}
        for (const n of ['res', 'ph', 'w', 'amp', 't', 'light']) U[n] = gl.getUniformLocation(prog, 'u_' + n)
        gl.disable(gl.BLEND)
        gl.clearColor(0, 0, 0, 0)
        cssSize = 0; appliedQ = 0
        fit()
        return true
      }

      /* Size the canvas to the stage; backing store scales with `quality`. */
      function fit () {
        if (!gl) return
        const r = stage.getBoundingClientRect()
        const s = Math.max(200, Math.min(Math.floor(Math.min(r.width, r.height)), 820))
        if (s === cssSize && quality === appliedQ) return
        cssSize = s; appliedQ = quality
        const dpr = Math.min(window.devicePixelRatio || 1, maxDpr) * quality
        canvas.style.width = canvas.style.height = s + 'px'
        canvas.width = canvas.height = Math.max(64, Math.round(s * dpr))
        gl.viewport(0, 0, canvas.width, canvas.height)
        gl.uniform2f(U.res, canvas.width, canvas.height)
      }

      function level () {
        const src = sources[mode]
        if (!src) return 0
        src.node.getByteTimeDomainData(src.buf)
        let sum = 0
        for (let i = 0; i < src.buf.length; i++) { const v = (src.buf[i] - 128) / 128; sum += v * v }
        const rms = Math.sqrt(sum / src.buf.length)
        return Math.pow(Math.min(Math.max((rms - 0.006) * src.gain, 0), 1), 0.75)
      }

      function frame (now) {
        raf = requestAnimationFrame(frame)
        const dtRaw = (now - last) * 0.001
        last = now
        const dt = Math.min(dtRaw, 0.1)

        /* adaptive resolution: only ever steps down, never flaps */
        if (dtRaw > 0 && dtRaw < 0.1) {
          emaDt += (dtRaw * 1000 - emaDt) * 0.05
          if (++frames > 90 && emaDt > 26 && quality > 0.55) {
            quality = Math.max(0.55, quality * 0.8); frames = 0; emaDt = 16; fit()
          }
        }

        const kw = 1 - Math.exp(-dt * 4.2)
        for (const k of KEYS) cur[k] += (tgt[k] - cur[k]) * kw
        lightCur += (lightTgt - lightCur) * (1 - Math.exp(-dt * 6))

        const target = level()
        lvl += (target - lvl) * (1 - Math.exp(-dt * (target > lvl ? 32 : 7)))

        const sp = motion * (0.35 + 0.5 * cur.L + 0.9 * cur.T + 1.1 * cur.S + 1.6 * lvl)
        ph[0] = (ph[0] + dt * sp)                              % TAU
        ph[1] = (ph[1] + dt * sp * 0.73)                       % TAU
        ph[2] = (ph[2] + dt * motion * (0.10 + 0.75 * cur.T + 0.10 * cur.act)) % TAU
        ph[3] = (ph[3] + dt * motion * 0.9)                    % TAU

        gl.uniform4f(U.ph, ph[0], ph[1], ph[2], ph[3])
        gl.uniform4f(U.w, cur.L, cur.T, cur.S, cur.act)
        gl.uniform2f(U.amp, lvl, cur.err)
        gl.uniform1f(U.t, (now * 0.001) % 1000)
        gl.uniform1f(U.light, lightCur)
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4)

        if (Halo.onFrame) Halo.onFrame()
      }

      function start () {
        cancelAnimationFrame(raf)
        last = performance.now()
        raf = requestAnimationFrame(frame)
      }

      function init () {
        if (!build()) { document.body.classList.add('no-gl'); return }
        document.body.classList.remove('no-gl')
        start()
      }

      canvas.addEventListener('webglcontextlost', (e) => { e.preventDefault(); cancelAnimationFrame(raf) })
      canvas.addEventListener('webglcontextrestored', () => init())
      if (typeof ResizeObserver !== 'undefined') new ResizeObserver(fit).observe(stage)
      else window.addEventListener('resize', fit)

      return {
        init,
        onFrame: null,
        setMode (m) { mode = m; tgt = MODES[m] || MODES.idle },
        setTheme (t) { lightTgt = t === 'light' ? 1 : 0 },
        /* mode -> AnalyserNode that drives the audio level in that mode */
        setSource (m, node, gain) {
          if (!node) { delete sources[m]; return }
          sources[m] = { node, buf: new Uint8Array(node.fftSize), gain }
        }
      }
    })()

    /* =====================================================================
       THEME  –  SAP Horizon Light / Dark (UI5 theme API)
    ===================================================================== */

    const THEME_KEY = 'visit-theme'
    function applyTheme (t) {
      document.documentElement.setAttribute('data-theme', t)
      Halo.setTheme(t)
      if (window.UI5) window.UI5.setTheme(t === 'dark' ? 'sap_horizon_dark' : 'sap_horizon')
      const btn = document.getElementById('themeBtn')
      btn.setAttribute('icon', t === 'dark' ? 'light-mode' : 'dark-mode')
      btn.setAttribute('text', t === 'dark' ? 'Helles Design' : 'Dunkles Design')
    }
    function toggleTheme () {
      const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'
      try { localStorage.setItem(THEME_KEY, next) } catch {}
      applyTheme(next)
    }

    /* =====================================================================
       APP  –  WebSocket, audio, session lifecycle
    ===================================================================== */

    const $ = (id) => document.getElementById(id)
    let ws = null, audioCtx = null, micStream = null, scriptProc = null, micAn = null, outAn = null, micCtx = null
    let nextPlayAt = 0, stopping = false

    /* app state -> halo mode, label, default sub-text */
    const STATES = {
      idle:       { mode: 'idle',       label: 'Bereit',     sub: 'Bereit, wenn du es bist' },
      connecting: { mode: 'connecting', label: 'Verbinde',   sub: 'Verbinde …' },
      ready:      { mode: 'listening',  label: 'Zuhören',    sub: 'Ich höre zu — bitte sprechen' },
      thinking:   { mode: 'thinking',   label: 'Denkt nach', sub: 'Einen Moment …' },
      speaking:   { mode: 'speaking',   label: 'Spricht',    sub: 'Assistent spricht' },
      error:      { mode: 'error',      label: 'Fehler',     sub: 'Fehler' },
      paused:     { mode: 'idle',       label: 'Pausiert',   sub: 'Mikrofon aus — deine Angaben bleiben erhalten' }
    }
    let paused = false, resumeTo = null /* [state, text] to show after the pause */
    let curState = '', curSub = '', readySub = null

    function swap (el, text) {
      el.textContent = text
      if (el.animate) el.animate(
        [{ opacity: 0, transform: 'translateY(5px)' }, { opacity: 1, transform: 'none' }],
        { duration: 320, easing: 'cubic-bezier(.2,.8,.2,1)' })
    }

    function setStatusState (state, text) {
      /* while paused, remember what the session is doing but keep showing "Pausiert" */
      if (paused && state !== 'paused' && state !== 'error' && state !== 'idle') {
        if (state === 'ready' && text != null) readySub = text
        resumeTo = [state, text]
        return
      }
      const st  = STATES[state]
      const sub = text ?? st.sub
      Halo.setMode(st.mode)
      if (state !== curState) swap($('stateLabel'), st.label)
      if (sub !== curSub || state !== curState) swap($('statusText'), sub)
      document.body.classList.toggle('is-error', state === 'error')
      if (state === 'ready' && text != null) readySub = text
      curState = state; curSub = sub
    }

    /* Fiori message strip in the session card (Negative / Critical / Positive / Information) */
    function showMsg (design, text) {
      const strip = $('msgStrip')
      strip.design = design
      strip.textContent = text
      strip.hidden = false
    }
    function hideMsg () { $('msgStrip').hidden = true }
    function loginErr (msg) { msg ? showMsg('Negative', msg) : hideMsg() }

    function addTranscript (role, text) {
      const who = role === 'user' ? 'Du' : 'Assistent'

      const li = document.createElement('ui5-li-custom')
      li.type = 'Inactive'
      li.accessibleName = who + ': ' + String(text)

      const row = document.createElement('div')
      row.className = 'msg ' + role

      const icon = document.createElement('ui5-icon')
      icon.setAttribute('name', role === 'user' ? 'person-placeholder' : 'ai')
      icon.setAttribute('accessible-name', who)

      const col = document.createElement('div')
      col.className = 'msg-col'
      const lbl = document.createElement('span')
      lbl.className = 'msg-role'
      lbl.textContent = who
      const txt = document.createElement('ui5-text')
      txt.className = 'msg-text'
      txt.textContent = String(text)

      col.append(lbl, txt)
      row.append(icon, col)
      li.append(row)

      $('transcript').append(li)
      const sc = $('transcriptScroll')
      sc.scrollTo({ top: sc.scrollHeight, behavior: 'smooth' })
    }

    /* ---- Audio playback: PCM16 → AudioContext (level read from outAn) ---- */

    function playPcm16 (buf) {
      if (!audioCtx) return
      const i16 = new Int16Array(buf)
      const ab  = audioCtx.createBuffer(1, i16.length, 24000)
      const f32 = ab.getChannelData(0)
      for (let i = 0; i < i16.length; i++) f32[i] = i16[i] / 32768
      const src = audioCtx.createBufferSource()
      src.buffer = ab; src.connect(outAn)
      const now = audioCtx.currentTime
      const t   = Math.max(now + 0.04, nextPlayAt)
      src.start(t); nextPlayAt = t + ab.duration
      if (curState !== 'speaking') setStatusState('speaking')
    }

    /* back to "listening" as soon as the scheduled audio has really finished */
    Halo.onFrame = () => {
      if (curState === 'speaking' && audioCtx && audioCtx.currentTime > nextPlayAt + 0.35 &&
          ws && ws.readyState === WebSocket.OPEN) {
        setStatusState('ready', readySub ?? undefined)
      }
    }

    /* ---- Microphone: Float32 → PCM16 ---- */

    /* audioCtx = playback (frozen during a pause), micCtx = capture (torn down during a pause) */
    async function startMicrophone () {
      audioCtx = new AudioContext({ sampleRate: 24000 })
      if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {})
      nextPlayAt = 0
      outAn = audioCtx.createAnalyser(); outAn.fftSize = 512; outAn.smoothingTimeConstant = 0
      outAn.connect(audioCtx.destination)
      Halo.setSource('speaking', outAn, 6)
      await startCapture()
    }

    async function startCapture () {
      const ctx = new AudioContext({ sampleRate: 24000 }) // before any await: still inside the click gesture
      ctx.resume().catch(() => {})
      let stream
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          audio: {
            channelCount: 1, sampleRate: 24000,
            echoCancellation: true, noiseSuppression: true, autoGainControl: false
          },
          video: false
        })
      } catch (err) {
        ctx.close()
        throw err
      }
      micCtx = ctx
      micStream = stream

      micAn = ctx.createAnalyser(); micAn.fftSize = 512; micAn.smoothingTimeConstant = 0
      Halo.setSource('listening', micAn, 14)

      const src  = ctx.createMediaStreamSource(stream)
      scriptProc = ctx.createScriptProcessor(4096, 1, 1)
      scriptProc.onaudioprocess = (e) => {
        if (paused || !ws || ws.readyState !== WebSocket.OPEN) return
        const f32 = e.inputBuffer.getChannelData(0)
        const i16 = new Int16Array(f32.length)
        for (let i = 0; i < f32.length; i++)
          i16[i] = Math.max(-32768, Math.min(32767, Math.round(f32[i] * 32767)))
        ws.send(i16.buffer)
      }
      src.connect(micAn)
      src.connect(scriptProc)
      scriptProc.connect(ctx.destination)
    }

    function stopCapture () {
      Halo.setSource('listening', null)
      if (scriptProc) { scriptProc.onaudioprocess = null; try { scriptProc.disconnect() } catch {} scriptProc = null }
      if (micStream)  { micStream.getTracks().forEach(t => t.stop()); micStream = null }
      if (micCtx)     { try { micCtx.close() } catch {} micCtx = null }
      micAn = null
    }

    function stopAudio () {
      stopCapture()
      Halo.setSource('speaking', null)
      if (audioCtx) { try { audioCtx.close() } catch {} audioCtx = null }
      outAn = null
    }

    /* ---- Session lifecycle ---- */

    /* ---- Pause / resume ----
       The WebSocket and the AI session stay open, so draft, tasks, transcript and conversation
       context are untouched. Only the microphone is muted and playback frozen. */
    function setPauseButton () {
      const btn = $('pauseBtn')
      btn.icon = paused ? 'media-play' : 'media-pause'
      btn.textContent = paused ? 'Fortsetzen' : 'Pausieren'
      btn.design = paused ? 'Emphasized' : 'Default'
    }

    function pauseSession () {
      if (paused || !audioCtx) return
      resumeTo = [curState, curState === 'ready' ? undefined : curSub]
      paused = true
      stopCapture()                       // releases the microphone completely
      audioCtx.suspend().catch(() => {})  // freezes playback; it continues where it stopped
      setStatusState('paused')
      setPauseButton()
    }

    async function resumeSession () {
      if (!paused) return
      $('pauseBtn').disabled = true
      if (audioCtx) audioCtx.resume().catch(() => {})
      try {
        await startCapture()              // fresh microphone stream and audio graph
      } catch (err) {
        if (audioCtx) audioCtx.suspend().catch(() => {})
        showMsg('Negative', 'Mikrofon konnte nicht neu gestartet werden: ' + err.message)
        $('pauseBtn').disabled = false
        return
      }
      if (!paused) { stopCapture(); return } // the session was ended in the meantime
      paused = false
      hideMsg()
      const [state, text] = resumeTo ?? ['ready']
      setStatusState(state, text ?? (state === 'ready' ? readySub ?? undefined : undefined))
      setPauseButton()
      $('pauseBtn').disabled = false
    }

    function resetPause () {
      paused = false; resumeTo = null
      setPauseButton()
      $('pauseBtn').disabled = true
    }

    function showLogin () {
      resetPause()
      $('loginSection').hidden = false
      $('mainSection').hidden = true
      $('startBtn').disabled = false
    }

    async function startSession () {
      hideMsg()
      $('startBtn').disabled = true
      const credFields = $('credFields')

      const headers = {}
      let devUserParam = ''
      if (!credFields.hidden) {
        const user = $('u').value.trim()
        if (!user) {
          loginErr('Bitte Benutzernamen eingeben.')
          $('startBtn').disabled = false
          return
        }
        headers['Authorization'] = 'Basic ' + btoa(user + ':' + $('p').value)
        devUserParam = user
      }

      let token
      try {
        let res = await fetch('/api/voice-token', { headers })
        if (res.status === 401 && credFields.hidden) {
          credFields.hidden = false
          showMsg('Information', 'Bitte Zugangsdaten eingeben (Entwicklungsmodus).')
          $('startBtn').disabled = false
          return
        }
        if (res.status === 401 && devUserParam)
          res = await fetch('/api/voice-token?_dev_user=' + encodeURIComponent(devUserParam))
        if (!res.ok) {
          loginErr('Anmeldung fehlgeschlagen (' + res.status + ').')
          $('startBtn').disabled = false
          return
        }
        token = (await res.json()).token
      } catch (err) {
        loginErr('Verbindungsfehler: ' + err.message)
        $('startBtn').disabled = false
        return
      }

      $('loginSection').hidden = true
      $('mainSection').hidden = false
      $('transcript').replaceChildren()
      $('previewCard').hidden = true
      $('previewText').textContent = ''
      $('stopBtn').disabled = false
      resetPause()
      stopping = false; readySub = null
      $('tcPanel').collapsed = true

      setStatusState('connecting')

      try {
        await startMicrophone()
      } catch (err) {
        stopAudio()
        showLogin()
        setStatusState('idle')
        loginErr('Mikrofonzugriff verweigert: ' + err.message)
        return
      }

      const proto = location.protocol === 'https:' ? 'wss:' : 'ws:'
      ws = new WebSocket(proto + '//' + location.host + '/ws/voice?token=' + encodeURIComponent(token))
      ws.binaryType = 'arraybuffer'

      ws.onopen = () => {
        setStatusState('connecting', 'Sitzung wird gestartet …')
        ws.send(JSON.stringify({
          type:     'start',
          timeZone: Intl.DateTimeFormat().resolvedOptions().timeZone,
          language: 'de'
        }))
      }

      ws.onmessage = (e) => {
        if (e.data instanceof ArrayBuffer) { playPcm16(e.data); return }
        let msg
        try { msg = JSON.parse(e.data) } catch { return }

        if (msg.type === 'ready') {
          $('pauseBtn').disabled = false
          setStatusState('ready')
        } else if (msg.type === 'transcript') {
          addTranscript(msg.role, msg.text)
        } else if (msg.type === 'new_visit') {
          $('transcript').replaceChildren()
          $('previewCard').hidden = true
          $('previewText').textContent = ''
          /* keep a failure message of the previous visit visible, drop a success message */
          const strip = $('msgStrip')
          if (!strip.hidden && strip.design === 'Positive') hideMsg()
          else if (!strip.hidden && !strip.textContent.startsWith('Vorheriger Besuch')) strip.textContent = 'Vorheriger Besuch: ' + strip.textContent
          readySub = null
          $('pauseBtn').disabled = true
          setStatusState('connecting', 'Nächster Besuch wird gesucht …')
        } else if (msg.type === 'speech') {
          /* "Zuhoeren" while the user talks, "Denkt nach" only after they stopped */
          const playing = audioCtx && audioCtx.currentTime < nextPlayAt
          if (msg.active) readySub = null
          if (!playing) setStatusState(msg.active ? 'ready' : 'thinking')
        } else if (msg.type === 'commit_preview') {
          $('previewText').textContent = msg.previewText ?? ''
          $('previewCard').hidden = false
          setStatusState('ready', 'Vorschau — bitte bestätigen oder ablehnen')
        } else if (msg.type === 'done') {
          const ok = msg.status === 'COMPLETED'
          const text = ok ? 'Besuch erfolgreich gespeichert' : 'Teilweise gespeichert'
          setStatusState(ok ? 'ready' : 'error', text)
          showMsg(ok ? 'Positive' : 'Critical',
            !ok && msg.failed?.length ? text + '. Nicht gespeichert – ' + msg.failed.join(' | ') : text)
        } else if (msg.type === 'error') {
          const text = String(msg.message ?? msg.code ?? 'Unbekannter Fehler')
          setStatusState('error', text)
          showMsg('Negative', text)
        } else if (msg.type === 'stopped') {
          if (ws) ws.close()
        }
      }

      ws.onerror = () => {
        setStatusState('error', 'WebSocket-Verbindungsfehler')
        showMsg('Negative', 'WebSocket-Verbindungsfehler')
      }

      ws.onclose = () => {
        if (paused) showMsg('Negative', 'Die Verbindung wurde während der Pause getrennt. Bitte starte ein neues Gespräch.')
        resetPause()
        stopAudio(); ws = null
        setStatusState('idle')
        setTimeout(showLogin, stopping ? 0 : 1800)
      }
    }

    function stopSession () {
      resetPause()
      stopping = true
      $('stopBtn').disabled = true
      setStatusState('connecting', 'Sitzung wird beendet …')
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'stop' }))
      } else {
        stopAudio(); ws = null
        setStatusState('idle')
        showLogin()
      }
    }

    /* ---- Boot ---- */
    $('startBtn').addEventListener('click', startSession)
    $('stopBtn').addEventListener('click', stopSession)
    $('pauseBtn').addEventListener('click', () => paused ? resumeSession() : pauseSession())
    $('themeBtn').addEventListener('click', toggleTheme)
    for (const id of ['u', 'p']) {
      $(id).addEventListener('keydown', (e) => { if (e.key === 'Enter' && !$('startBtn').disabled) startSession() })
    }

    Halo.init()
    setStatusState('idle')
    /* the UI5 bundle is a deferred module: it has run by DOMContentLoaded */
    window.addEventListener('DOMContentLoaded', () => {
      if (window.UI5) window.UI5.setLanguage('de')
      applyTheme(document.documentElement.getAttribute('data-theme'))
    })
  </script>
</body>
</html>
