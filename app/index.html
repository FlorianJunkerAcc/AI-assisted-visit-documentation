<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Besuchsdokumentation</title>
  <style>
    :root {
      --brand:       #0063c5;
      --brand-dark:  #004fa6;
      --success:     #107e3e;
      --warning:     #e9730c;
      --error:       #bb0000;
      --idle-color:  #6a6d70;
      --bg:          #f5f5f5;
      --card:        #ffffff;
      --border:      #d9d9d9;
      --text:        #32363a;
      --text-muted:  #6a6d70;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ---- header ---- */
    header {
      background: var(--brand);
      color: #fff;
      padding: 0 1.5rem;
      height: 3rem;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      box-shadow: 0 2px 6px rgba(0,0,0,0.18);
      flex-shrink: 0;
    }
    header h1 { font-size: 1rem; font-weight: 600; letter-spacing: 0.01em; }

    /* ---- layout ---- */
    main {
      max-width: 680px;
      width: 100%;
      margin: 1.75rem auto;
      padding: 0 1rem;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    /* ---- card ---- */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.25rem 1.5rem;
      box-shadow: 0 1px 4px rgba(0,0,0,0.07);
    }

    /* ---- form ---- */
    .field { display: flex; flex-direction: column; gap: 0.3rem; margin-bottom: 0.9rem; }
    .field:last-of-type { margin-bottom: 1.1rem; }
    .field label {
      font-size: 0.72rem; font-weight: 700;
      color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em;
    }
    .field input {
      padding: 0.5rem 0.75rem; font-size: 0.9375rem;
      border: 1px solid var(--border); border-radius: 4px; outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .field input:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 2px rgba(0,99,197,0.15);
    }

    /* ---- buttons ---- */
    .btn {
      display: inline-flex; align-items: center; gap: 0.4rem;
      padding: 0.6rem 1.5rem; font-size: 0.875rem; font-weight: 600;
      border-radius: 4px; border: 1px solid transparent;
      cursor: pointer; transition: background 0.1s, opacity 0.1s; white-space: nowrap;
    }
    .btn:disabled { opacity: 0.4; cursor: default; }
    .btn-primary { background: var(--brand); color: #fff; border-color: var(--brand); }
    .btn-primary:not(:disabled):hover { background: var(--brand-dark); border-color: var(--brand-dark); }
    .btn-danger  { background: var(--error); color: #fff; border-color: var(--error); }
    .btn-danger:not(:disabled):hover  { background: #990000; border-color: #990000; }

    /* ---- login error ---- */
    #loginErr { color: var(--error); font-size: 0.85rem; min-height: 1.2rem; margin-top: 0.5rem; }

    /* ---- status bar ---- */
    .status-bar {
      display: flex; align-items: center; gap: 0.65rem;
      padding: 0.6rem 0.9rem;
      border-radius: 6px; border: 1px solid #c6dfff;
      background: #f0f7ff; font-size: 0.875rem; color: var(--brand-dark);
      min-height: 2.5rem;
    }
    .status-dot {
      width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;
      background: var(--idle-color); transition: background 0.3s;
    }
    .status-dot.connecting { background: var(--warning); animation: blink 1s ease-in-out infinite; }
    .status-dot.ready      { background: var(--success); animation: none; }
    .status-dot.listening  { background: var(--success); animation: blink 0.8s ease-in-out infinite; }
    .status-dot.speaking   { background: var(--brand);   animation: blink 0.45s ease-in-out infinite; }
    .status-dot.error      { background: var(--error);   animation: none; }

    @keyframes blink {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.4; transform: scale(1.35); }
    }

    /* ---- preview card ---- */
    #previewCard {
      border-left: 4px solid var(--warning);
      background: #fffbeb;
      border-top: 1px solid #f0d060;
      border-right: 1px solid #f0d060;
      border-bottom: 1px solid #f0d060;
      padding: 1rem 1.25rem;
      display: none;
    }
    .preview-title {
      font-size: 0.72rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.05em;
      color: var(--warning); margin-bottom: 0.5rem;
    }
    #previewText {
      white-space: pre-wrap; font-size: 0.875rem; line-height: 1.65; color: var(--text);
    }

    /* ---- transcript ---- */
    .transcript-card { padding: 0.75rem 1rem; }
    #transcript {
      display: flex; flex-direction: column; gap: 0.75rem;
      max-height: 380px; overflow-y: auto;
      padding: 0.25rem 0;
      scrollbar-width: thin;
    }
    #transcript:empty::before {
      content: 'Das Gespräch erscheint hier …';
      color: var(--text-muted); font-size: 0.85rem; font-style: italic;
      text-align: center; padding: 1.5rem 0; display: block;
    }

    /* ---- chat bubbles ---- */
    .bubble-row { display: flex; flex-direction: column; gap: 0.15rem; }
    .bubble-row.user  { align-items: flex-end; }
    .bubble-row.assistant { align-items: flex-start; }

    .bubble {
      max-width: 82%; padding: 0.55rem 0.9rem;
      border-radius: 12px; font-size: 0.9rem; line-height: 1.5;
      word-break: break-word;
    }
    .bubble-row.user .bubble {
      background: var(--brand); color: #fff;
      border-bottom-right-radius: 3px;
    }
    .bubble-row.assistant .bubble {
      background: #f0f4f9; color: var(--text);
      border: 1px solid var(--border);
      border-bottom-left-radius: 3px;
    }

    .bubble-label {
      font-size: 0.68rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.04em;
      color: var(--text-muted); padding: 0 0.1rem;
    }

    /* ---- misc ---- */
    #mainSection { display: none; flex-direction: column; gap: 1rem; }
    #mainSection.visible { display: flex; }

    @media (max-width: 480px) {
      header { padding: 0 1rem; }
      main { margin: 1rem auto; padding: 0 0.75rem; gap: 0.75rem; }
      .card { padding: 1rem; }
      .bubble { max-width: 92%; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Besuchsdokumentation</h1>
  </header>

  <main>

    <!-- Login -->
    <section id="loginSection" class="card">
      <!-- Hidden in production (App Router + XSUAA). Shown automatically on 401. -->
      <div id="credFields" hidden>
        <div class="field">
          <label for="u">Benutzername</label>
          <input id="u" value="alice" autocomplete="username">
        </div>
        <div class="field">
          <label for="p">Passwort</label>
          <input id="p" type="password" value="alice" autocomplete="current-password">
        </div>
      </div>
      <button class="btn btn-primary" id="startBtn" onclick="startSession()">Gespräch starten</button>
      <div id="loginErr"></div>
    </section>

    <!-- Active session -->
    <section id="mainSection">
      <!-- Status indicator -->
      <div class="card" style="padding: 0.65rem 1rem;">
        <div class="status-bar">
          <div class="status-dot connecting" id="statusDot"></div>
          <span id="statusText">Verbinde …</span>
        </div>
      </div>

      <!-- Commit preview (shown when prepareCommitPreview fires) -->
      <div id="previewCard" class="card">
        <div class="preview-title">Vorschau</div>
        <div id="previewText"></div>
      </div>

      <!-- Transcript -->
      <div class="card transcript-card">
        <div id="transcript"></div>
      </div>

      <!-- Stop button -->
      <div>
        <button class="btn btn-danger" id="stopBtn" onclick="stopSession()">Gespräch beenden</button>
      </div>
    </section>

  </main>

  <script>
    let ws = null
    let audioCtx = null
    let micStream = null
    let scriptProc = null
    let nextPlayAt = 0
    let stopping = false
    let speakingTimer = null

    // --- status state ---

    function setStatusState (state, text) {
      const dot = document.getElementById('statusDot')
      const label = document.getElementById('statusText')
      dot.className = 'status-dot ' + state
      const defaults = {
        connecting: 'Verbinde …',
        ready:      'Bereit — bitte sprechen',
        listening:  'Hoere zu …',
        speaking:   'Assistent spricht …',
        error:      'Fehler'
      }
      label.textContent = text ?? defaults[state] ?? state
    }

    // --- login helpers ---

    function loginErr (msg) { document.getElementById('loginErr').textContent = msg }

    // --- transcript ---

    function addTranscript (role, text) {
      const row = document.createElement('div')
      row.className = 'bubble-row ' + role
      const lbl = document.createElement('span')
      lbl.className = 'bubble-label'
      lbl.textContent = role === 'user' ? 'Sie' : 'Assistent'
      const bub = document.createElement('div')
      bub.className = 'bubble'
      bub.textContent = String(text)
      row.appendChild(lbl)
      row.appendChild(bub)
      const tc = document.getElementById('transcript')
      tc.appendChild(row)
      row.scrollIntoView({ behavior: 'smooth', block: 'nearest' })
    }

    // --- audio playback: PCM16 → AudioContext ---

    function playPcm16 (buf) {
      if (!audioCtx) return
      const i16 = new Int16Array(buf)
      const ab = audioCtx.createBuffer(1, i16.length, 24000)
      const f32 = ab.getChannelData(0)
      for (let i = 0; i < i16.length; i++) f32[i] = i16[i] / 32768
      const src = audioCtx.createBufferSource()
      src.buffer = ab
      src.connect(audioCtx.destination)
      const now = audioCtx.currentTime
      const t = Math.max(now + 0.04, nextPlayAt)
      src.start(t)
      nextPlayAt = t + ab.duration

      // Visual: show speaking state while audio is queued
      setStatusState('speaking')
      clearTimeout(speakingTimer)
      speakingTimer = setTimeout(() => {
        if (ws && ws.readyState === WebSocket.OPEN) setStatusState('ready')
      }, 700)
    }

    // --- microphone: MediaStream → PCM16 via ScriptProcessor ---

    async function startMicrophone () {
      micStream = await navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1, sampleRate: 24000 }, video: false })
      audioCtx = new AudioContext({ sampleRate: 24000 })
      nextPlayAt = 0
      const src = audioCtx.createMediaStreamSource(micStream)
      scriptProc = audioCtx.createScriptProcessor(4096, 1, 1)
      scriptProc.onaudioprocess = (e) => {
        if (!ws || ws.readyState !== WebSocket.OPEN) return
        const f32 = e.inputBuffer.getChannelData(0)
        const i16 = new Int16Array(f32.length)
        for (let i = 0; i < f32.length; i++) {
          i16[i] = Math.max(-32768, Math.min(32767, Math.round(f32[i] * 32767)))
        }
        ws.send(i16.buffer)
      }
      src.connect(scriptProc)
      scriptProc.connect(audioCtx.destination)
    }

    function stopAudio () {
      clearTimeout(speakingTimer)
      if (scriptProc) { try { scriptProc.disconnect() } catch {} scriptProc = null }
      if (micStream)  { micStream.getTracks().forEach(t => t.stop()); micStream = null }
      if (audioCtx)   { try { audioCtx.close() } catch {} audioCtx = null }
    }

    // --- session lifecycle ---

    async function startSession () {
      loginErr('')
      document.getElementById('startBtn').disabled = true
      const credFields = document.getElementById('credFields')

      // Build request headers.
      // Production: App Router adds XSUAA JWT, no credentials needed.
      // Development: mocked auth uses Basic Auth; credentials shown after first 401.
      // BAS tunnel: strips Authorization headers → retry with ?_dev_user= fallback.
      const headers = {}
      let devUserParam = ''
      if (!credFields.hidden) {
        const user = document.getElementById('u').value.trim()
        if (!user) {
          loginErr('Bitte Benutzernamen eingeben.')
          document.getElementById('startBtn').disabled = false
          return
        }
        headers['Authorization'] = 'Basic ' + btoa(user + ':' + document.getElementById('p').value)
        devUserParam = user
      }

      // 1. Fetch one-time WebSocket token from CAP
      let token
      try {
        let res = await fetch('/api/voice-token', { headers })
        if (res.status === 401 && credFields.hidden) {
          credFields.hidden = false
          loginErr('Bitte Zugangsdaten eingeben (Entwicklungsmodus).')
          document.getElementById('startBtn').disabled = false
          return
        }
        // BAS tunnel fallback
        if (res.status === 401 && devUserParam) {
          res = await fetch('/api/voice-token?_dev_user=' + encodeURIComponent(devUserParam))
        }
        if (!res.ok) {
          loginErr('Anmeldung fehlgeschlagen (' + res.status + '). Zugangsdaten prüfen.')
          document.getElementById('startBtn').disabled = false
          return
        }
        token = (await res.json()).token
      } catch (err) {
        loginErr('Verbindungsfehler: ' + err.message)
        document.getElementById('startBtn').disabled = false
        return
      }

      // 2. Switch view
      document.getElementById('loginSection').hidden = true
      const mainSec = document.getElementById('mainSection')
      mainSec.classList.add('visible')
      document.getElementById('transcript').innerHTML = ''
      document.getElementById('previewCard').style.display = 'none'
      document.getElementById('previewText').textContent = ''
      document.getElementById('stopBtn').disabled = false
      stopping = false
      setStatusState('connecting')

      // 3. Microphone (must be on user-gesture stack)
      try {
        await startMicrophone()
      } catch (err) {
        stopAudio()
        document.getElementById('loginSection').hidden = false
        mainSec.classList.remove('visible')
        loginErr('Mikrofonzugriff verweigert: ' + err.message)
        document.getElementById('startBtn').disabled = false
        return
      }

      // 4. Open WebSocket with token
      const proto = location.protocol === 'https:' ? 'wss:' : 'ws:'
      ws = new WebSocket(proto + '//' + location.host + '/ws/voice?token=' + encodeURIComponent(token))
      ws.binaryType = 'arraybuffer'

      ws.onopen = () => {
        setStatusState('connecting', 'Sitzung wird gestartet …')
        ws.send(JSON.stringify({
          type: 'start',
          timeZone: Intl.DateTimeFormat().resolvedOptions().timeZone,
          language: 'de'
        }))
      }

      ws.onmessage = (e) => {
        if (e.data instanceof ArrayBuffer) { playPcm16(e.data); return }
        let msg
        try { msg = JSON.parse(e.data) } catch { return }

        if (msg.type === 'ready') {
          setStatusState('ready')
        } else if (msg.type === 'transcript') {
          addTranscript(msg.role, msg.text)
          if (msg.role === 'user') setStatusState('listening', 'Verarbeite …')
        } else if (msg.type === 'commit_preview') {
          const pc = document.getElementById('previewCard')
          document.getElementById('previewText').textContent = msg.previewText ?? ''
          pc.style.display = 'block'
          setStatusState('ready', 'Vorschau wird vorgelesen — bitte bestätigen oder ablehnen')
        } else if (msg.type === 'done') {
          const ok = msg.status === 'COMPLETED'
          setStatusState(ok ? 'ready' : 'error',
            ok ? 'Besuch erfolgreich gespeichert.' : 'Teilweise gespeichert (' + msg.code + ').')
        } else if (msg.type === 'error') {
          setStatusState('error', 'Fehler: ' + String(msg.message ?? msg.code ?? ''))
        } else if (msg.type === 'stopped') {
          if (ws) ws.close()
        }
      }

      ws.onerror = () => setStatusState('error', 'WebSocket-Verbindungsfehler.')

      ws.onclose = () => {
        stopAudio()
        ws = null
        const delay = stopping ? 0 : 1800
        setTimeout(() => {
          document.getElementById('loginSection').hidden = false
          document.getElementById('mainSection').classList.remove('visible')
          document.getElementById('startBtn').disabled = false
        }, delay)
      }
    }

    function stopSession () {
      stopping = true
      document.getElementById('stopBtn').disabled = true
      setStatusState('connecting', 'Sitzung wird beendet …')
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'stop' }))
      } else {
        stopAudio()
        ws = null
        document.getElementById('loginSection').hidden = false
        document.getElementById('mainSection').classList.remove('visible')
        document.getElementById('startBtn').disabled = false
      }
    }
  </script>
</body>
</html>
